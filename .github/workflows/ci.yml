name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      # `tsc -b` covers the extension, the Node-side config and source guards,
      # and the Playwright harness in one pass through the project references.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Builds the Gecko target and runs web-ext's static checks over it. Zero
      # errors is the bar; two warning classes are expected and documented in
      # docs/build-targets.md. This is the cheap gate that catches an
      # unsupported manifest key or a reserved keyboard shortcut before a
      # release job tries to upload the package to AMO.
      - name: Lint Firefox package
        run: pnpm lint:firefox

  # Kept as its own job so a browser-level flake reddens only the end-to-end
  # signal and leaves the unit-test result readable. Covers e2e/specs only:
  # e2e/real and e2e/manual drive the real LinkedIn site and need credentials.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite loads the unpacked MV3 build through a persistent context,
      # which needs a real Chromium rather than the bundled headless shell.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
